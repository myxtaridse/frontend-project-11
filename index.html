<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="bg-slate-800 flex justify-center items-center py-7 text-white">
      <div>
        <h1 class="text-3xl">RSS агрегатор</h1>
        <p class="text-md">Начните читать RSS сегодня! Это легко, это красиво.</p>
        <form class="mt-2">
          <label for="link-rss" class="block text-sm opacity-70 mb-1">Ссылка RSS</label>
          <input
            id="link-rss"
            type="text"
            placeholder="ссылка RSS"
            class="border rounded-sm bg-white px-2 py-1 w-120"
          />
          <input type="submit" value="Добавить" class="bg-blue-500 px-5 py-1 rounded-sm" />
        </form>
        <p class="text-xs opacity-60 mt-1">Пример: https://lorem-rss.hexlet.app/feed</p>
      </div>
    </div>
    <script src="./src/index.js"></script>
  </body>
</html>
