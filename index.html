<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS-агрегатор</title>
  </head>
  <body>
    <div class="bg-slate-800 flex justify-center items-center py-7 text-white">
      <div class="flex flex-col gap-2 w-11/12 lg:w-1/2">
        <h1 class="text-4xl" data-i18n="searchForm.title"></h1>
        <p class="text-lg" data-i18n="searchForm.description"></p>
        <form class="w-full" id="searchForm" novalidate>
          <label for="searchInput" class="block text-sm opacity-80" data-i18n="searchForm.label"></label>
          <div class="w-full flex gap-2">
            <input
              name="href"
              id="searchInput"
              type="url"
              placeholder="ссылка RSS"
              data-i18n="searchForm.input"
              class="w-full border rounded-sm bg-white px-2 py-1 placeholder:text-gray-400 text-black"
            />
            <button
              id="submitBtn"
              type="submit"
              data-i18n="searchForm.submitBtn"
              class="bg-blue-500 px-5 rounded-sm cursor-pointer text-base"
            ></button>
          </div>
          <p class="text-sm opacity-70" data-i18n="searchForm.example"></p>
          <span id="message" class="text-xs mt-1"></span>
        </form>
      </div>
    </div>
    <div id="contents" class="w-full justify-center mt-10 hidden mb-20">
      <div class="flex flex-col-reverse w-11/12 gap-6 lg:w-2/3 xl:gap-12 items-start xl:flex-row">
        <div class="rounded-sm border border-gray-300 flex-1 p-4 flex flex-col gap-4 w-full xl:w-2/3">
          <h3 data-i18n="contents.posts-title" class="text-lg font-bold"></h3>
          <div id="posts" class="flex flex-col"></div>
        </div>
        <div class="rounded-sm border border-gray-300 p-4 flex flex-col gap-4 w-full xl:w-1/3">
          <h3 data-i18n="contents.feed-title" class="text-lg font-bold"></h3>
          <div id="feeds"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
