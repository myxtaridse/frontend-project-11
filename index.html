<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS-агрегатор</title>
  </head>
  <body>
    <div class="bg-slate-800 flex justify-center items-center py-7 text-white">
      <div class="flex flex-col gap-2">
        <h1 class="text-4xl">RSS агрегатор</h1>
        <p class="text-lg">Начните читать RSS сегодня! Это легко, это красиво.</p>
        <form id="searchForm" novalidate>
          <label for="searchInput" class="block text-sm opacity-80">Ссылка RSS</label>
          <input
            id="searchInput"
            type="url"
            placeholder="ссылка RSS"
            class="border rounded-sm bg-white px-2 py-1 w-120 my-2 placeholder:text-gray-400 text-black"
          />
          <button
            id="submitBtn"
            type="submit"
            class="bg-blue-500 px-5 py-1 rounded-sm cursor-pointer"
          >
            Добавить
          </button>
          <p class="text-sm opacity-70">Пример: https://lorem-rss.hexlet.app/feed</p>
          <span id="message" class="text-xs mt-1"></span
          >
        </form>
      </div>
    </div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
