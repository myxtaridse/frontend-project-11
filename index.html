<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS-агрегатор</title>
  </head>
  <body class="relative">
    <main>
      <div class="bg-slate-800 flex justify-center items-center py-7 text-white">
        <div class="flex flex-col gap-2 w-11/12 lg:w-1/2">
          <h1 class="text-4xl" data-i18n="searchForm.title"></h1>
          <p class="text-lg" data-i18n="searchForm.description"></p>
          <form role="search" class="w-full" novalidate>
            <label
              for="searchInput"
              class="block text-sm opacity-80"
              data-i18n="searchForm.label"
            ></label>
            <div class="w-full flex gap-2">
              <input
                name="href"
                id="searchInput"
                data-i18n-placeholder="searchForm.inputPlaceholder"
                class="w-full border rounded-sm bg-white px-2 py-1 placeholder:text-gray-400 text-black"
              />
              <button
                id="submitBtn"
                type="submit"
                data-i18n="searchForm.submitBtn"
                class="bg-blue-500 px-5 rounded-sm cursor-pointer text-base"
              ></button>
            </div>
            <p class="text-sm opacity-70" data-i18n="searchForm.example"></p>
            <span id="search-message" role="status" class="text-xs mt-1"></span>
          </form>
        </div>
      </div>
      <div id="contents" class="w-full justify-center mt-10 hidden mb-20">
        <div class="flex flex-col-reverse w-11/12 gap-6 lg:w-2/3 xl:gap-12 items-start xl:flex-row">
          <section
            aria-labelledby="posts-title"
            class="rounded-sm border border-gray-300 flex-1 p-4 flex flex-col gap-4 w-full xl:w-2/3"
          >
            <h3 id="posts-title" data-i18n="contents.posts-title" class="text-lg font-bold"></h3>
            <ul role="list" id="posts" class="flex flex-col"></ul>
          </section>
          <section
            aria-labelledby="feeds-title"
            class="rounded-sm border border-gray-300 p-4 flex flex-col gap-4 w-full xl:w-1/3"
          >
            <h3 id="feeds-title" data-i18n="contents.feed-title" class="text-lg font-bold"></h3>
            <ul role="list" id="feeds"></ul>
          </section>
        </div>
      </div>
    </main>
    <dialog
      aria-labelledby="post-title"
      data-test="modal-body"
      class="bg-black/70 fixed inset-0 backdrop-blur-[1px] z-1 min-w-screen min-h-screen"
    >
      <div
        class="bg-white w-11/12 lg:w-1/2 xl:w-1/3 mx-auto mt-10 rounded-sm p-4 flex flex-col gap-4"
      >
        <div class="flex justify-between items-center">
          <h2 id="post-title" class="font-semibold text-lg"></h2>
          <div role="button" data-action="close-btn" class="w-[16px] h-[16px] cursor-pointer">
            <svg viewBox="-0.5 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path
                  d="M3 21.32L21 3.32001"
                  stroke="#000000"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <path
                  d="M3 3.32001L21 21.32"
                  stroke="#000000"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
          </div>
        </div>
        <hr class="w-full bg-gray-300 border-none h-[1px]" />
        <p id="post-description"></p>
        <hr class="w-full bg-gray-300 border-none h-[1px]" />
        <div class="flex justify-end gap-2">
          <button
            id="post-more-btn"
            class="bg-blue-500 text-white px-2 xl:px-6 py-1 xl:py-2 rounded-xs cursor-pointer"
          >
            Читать полностью
          </button>
          <button
            data-action="close-btn"
            class="bg-gray-500 text-white px-6 py-2 rounded-xs cursor-pointer"
          >
            Закрыть
          </button>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
