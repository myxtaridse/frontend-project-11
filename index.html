<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSS-агрегатор</title>
  </head>
  <body>
    <div class="bg-slate-800 flex justify-center items-center py-7 text-white">
      <div class="flex flex-col gap-2">
        <h1 class="text-4xl" data-i18n="title"></h1>
        <p class="text-lg" data-i18n="description"></p>
        <form id="searchForm" novalidate>
          <label for="searchInput" class="block text-sm opacity-80" data-i18n="label"></label>
          <input
            id="searchInput"
            type="url"
            placeholder="ссылка RSS"
            data-i18n="input"
            class="border rounded-sm bg-white px-2 py-1 w-120 my-2 placeholder:text-gray-400 text-black"
          />
          <button
            id="submitBtn"
            type="submit"
            data-i18n="submitBtn"
            class="bg-blue-500 px-5 py-1 rounded-sm cursor-pointer"
          ></button>
          <p class="text-sm opacity-70" data-i18n="example"></p>
          <span id="message" class="text-xs mt-1"></span>
        </form>
      </div>
    </div>
    <div class="w-full flex justify-center mt-10">
      <div class="flex w-2/3 gap-12 items-start">
        <div class="rounded-sm border border-gray-300 flex-1 p-4 flex flex-col gap-4">
          <h3 class="text-lg font-bold">Посты</h3>
          <div class="flex flex-col gap-3">
            <div class="flex justify-between">
              <a href="#"><p class="text-md">Агрегация / Python: Деревья</p></a>
              <button class="border border-blue-500 px-3 py-1 rounded-sm cursor-pointer text-blue-500 text-sm font-medium hover:bg-blue-500 hover:text-white transition delay-150 duration-300 ease-in-out">Просмотр</button>
            </div>
            <hr class="w-full bg-gray-300 border-none h-[1px]">
            <div class="flex justify-between">
              <a href="#"><p class="text-md">Агрегация / Python: Деревья</p></a>
              <button class="border border-blue-500 px-3 py-1 rounded-sm cursor-pointer text-blue-500 text-sm font-medium hover:bg-blue-500 hover:text-white transition delay-150 duration-300 ease-in-out">Просмотр</button>
            </div>
          </div>
        </div>
        <div class="rounded-sm border border-gray-300 p-4 flex flex-col gap-4 h-auto">
          <h3 class="text-lg font-bold">Фиды</h3>
          <div>
            <h4 class="text-md font-semibold">Новые уроки на Хекслете</h4>
            <p class="text-gray-500">Практические уроки по программированию</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
